display_information:
  name: devin-squad
  description: Chat with AI personas and coordinate Devin workers
features:
  bot_user:
    display_name: devin-squad
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - chat:write.customize
      - channels:history
      - users:read
      - reactions:write
      - files:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
  socket_mode_enabled: true
